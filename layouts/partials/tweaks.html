<div id="tweaks">
  <h4>Tweaks</h4>
  <div class="tw-row">
    <span class="tw-label">Accent</span>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="tw-row">
    <span class="tw-label">Theme</span>
    <div class="seg" id="themeSeg">
      <button data-theme-val="dark">Dark</button>
      <button data-theme-val="light">Light</button>
    </div>
  </div>
  <div class="tw-row">
    <span class="tw-label">Headline font</span>
    <div class="seg" id="fontSeg">
      <button data-font="'Space Grotesk', sans-serif">Grotesk</button>
      <button data-font="'IBM Plex Sans', sans-serif">Plex</button>
    </div>
  </div>
</div>
