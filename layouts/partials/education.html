<section class="section-pad wrap" id="education">
  <div class="eyebrow reveal"><span class="num">04</span> / {{ T "education_eyebrow" }}</div>
  <div class="edu-grid">
    {{ range $i, $edu := site.Data.education }}
      <div class="edu-card reveal{{ if gt $i 0 }} d1{{ end }}">
        <div class="deg">{{ $edu.degree }}</div>
        <div class="inst">{{ $edu.institution }}</div>
      </div>
    {{ end }}
  </div>
</section>
