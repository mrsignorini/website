<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ with .Params.browser_title }}{{ . }}{{ else }}{{ .Title }}{{ end }}</title>
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
{{ $style := resources.Get "scss/main.scss" | toCSS (dict "targetPath" "css/main.css" "enableSourceMap" (eq hugo.Environment "development")) }}
{{ if eq hugo.Environment "development" }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
{{ else }}
  <link rel="stylesheet" href="{{ ($style | minify | fingerprint).RelPermalink }}">
{{ end }}
